<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<button id="chat-float-btn" onclick="toggleChat()">💬</button>

<div id="chat-modal">
    <div class="chat-header">Ask me anything</div>
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-input-bar">
        <input id="chat-input" placeholder="Input the question" autocomplete="off">
        <button onclick="sendMessage()" id="chat-send-btn">Send</button>
    </div>
</div>

<script>
    const WORKER_URL = "https://square-mode-81a5.1793410861.workers.dev/";

    let messages = [
        { role: "assistant", content: "Hello~ I am your blog AI assistant. You can ask me anything about this blog." }
    ];

    const modal = document.getElementById("chat-modal");
    const messagesDom = document.getElementById("chat-messages");
    const chatInput = document.getElementById("chat-input");
    const sendBtn = document.getElementById("chat-send-btn");

    function toggleChat() {
        modal.classList.toggle("active");
        renderMessages();
    }

    // 添加 Markdown 解析函数
    function renderMarkdown(text) {
        return marked.parse(text, {
            breaks: true, // 换行符转换成 <br>
            gfm: true // 支持 GitHub 风格的 Markdown
        });
    }

    // 渲染消息界面
    function renderMessages() {
        messagesDom.innerHTML = messages.map(m => {
            if (m.role === 'assistant') {
                return `
                    <div class="bubble-ai">
                        <div class="markdown-content">${renderMarkdown(m.content)}</div>
                    </div>
                `;
            } else if (m.role === 'user') {
                return `
                    <div class="bubble-user">${escapeHtml(m.content)}</div>
                `;
            } else {
                return `
                    <div class="bubble-error">${m.content}</div>
                `;
            }
        }).join("");
        messagesDom.scrollTop = messagesDom.scrollHeight;
    }

    // 安全处理：转义 HTML 特殊字符（防止 XSS）
    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // 控制输入框状态，防止在生成中途重复提交
    function setInputState(disabled) {
        chatInput.disabled = disabled;
        sendBtn.disabled = disabled;
        if (!disabled) chatInput.focus();
    }

    async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        chatInput.value = "";
        setInputState(true); // 锁定输入框

        messages.push({ role: "user", content: text });

        // 预先放置一个空的 AI 回复气泡，用于后续打字机追加
        messages.push({ role: "assistant", content: "" });
        const aiMessageIndex = messages.length - 1;
        renderMessages();

        try {
            // 发送请求时，剔除掉最后那个空的 assistant 消息
            const payloadMessages = messages.slice(0, -1);

            const res = await fetch(WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages: payloadMessages })
            });

            if (!res.ok) throw new Error(`HTTP Error ${res.status}`);

            // 核心修改：流式读取响应数据
            const reader = res.body.getReader();
            const decoder = new TextDecoder("utf-8");

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split("\n").filter(line => line.trim() !== "");

                for (const line of lines) {
                    if (line.includes("[DONE]")) continue;

                    if (line.startsWith("data:")) {
                        try {
                            const data = JSON.parse(line.slice(5));
                            // 获取增量文本（兼容常见的 OpenAI 格式流）
                            const contentStr = data.choices[0]?.delta?.content || "";
                            if (contentStr) {
                                messages[aiMessageIndex].content += contentStr;
                                renderMessages(); // 每次有新字都重新渲染
                            }
                        } catch (e) {
                            // 忽略单个数据块解析错误，流式传输中常有截断现象
                        }
                    }
                }
            }

        } catch (e) {
            console.error("Network error:", e);
            messages[aiMessageIndex] = {
                role: "error",
                content: "❌ Service exception, please try again later."
            };
            renderMessages();
        } finally {
            setInputState(false); // 解锁输入框
        }
    }

    // 处理回车发送与中文输入法兼容
    let isComposing = false;
    chatInput.addEventListener("compositionstart", () => isComposing = true);
    chatInput.addEventListener("compositionend", (e) => {
        isComposing = false;
        // 有些浏览器在 compositionend 时会同时触发 Enter
        if (e.data && e.key === "Enter" && !chatInput.disabled) {
            sendMessage();
        }
    });

    chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !isComposing && !chatInput.disabled) {
            e.preventDefault();
            sendMessage();
        }
    });

    // 优化 marked 渲染配置
    marked.setOptions({
        mangle: false,
        headerIds: false
    });
</script>
