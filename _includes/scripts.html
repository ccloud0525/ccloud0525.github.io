<!-- 引入轻量 Markdown 解析库（无需本地部署，CDN 直接用） -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<button id="chat-float-btn" onclick="toggleChat()">💬</button>

<div id="chat-modal">
    <div class="chat-header">Ask me anything</div>
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-input-bar">
        <input id="chat-input" placeholder="Input the question" autocomplete="off">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const WORKER_URL = "https://square-mode-81a5.1793410861.workers.dev/";

    let messages = [
        { role: "assistant", content: "Hello~ I am your blog AI assistant. You can ask me anything about the blog. I am deployed on Cloudflare's free service, so it may be a bit slow. Please forgive me." }
    ];

    const modal = document.getElementById("chat-modal");
    const messagesDom = document.getElementById("chat-messages");
    const chatInput = document.getElementById("chat-input");

    function toggleChat() {
        modal.classList.toggle("active");
        renderMessages();
    }

    // 【核心修改】添加 Markdown 解析函数
    function renderMarkdown(text) {
        // 用 marked 库解析 Markdown 为 HTML
        return marked.parse(text, {
            breaks: true, // 换行符转换成 <br>
            gfm: true // 支持 GitHub 风格的 Markdown
        });
    }

    // 【修改渲染逻辑】AI 消息用 Markdown 渲染
    function renderMessages() {
        messagesDom.innerHTML = messages.map(m => {
            if (m.role === 'assistant') {
                // AI 消息：渲染 Markdown
                return `
                    <div class="bubble-ai">
                        <div class="markdown-content">${renderMarkdown(m.content)}</div>
                    </div>
                `;
            } else if (m.role === 'user') {
                // 用户消息：纯文本（避免 XSS）
                return `
                    <div class="bubble-user">${escapeHtml(m.content)}</div>
                `;
            } else {
                // 错误消息：纯文本
                return `
                    <div class="bubble-error">${m.content}</div>
                `;
            }
        }).join("");
        messagesDom.scrollTop = messagesDom.scrollHeight;
    }

    // 安全处理：转义 HTML 特殊字符（防止 XSS）
    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;
        chatInput.value = "";

        messages.push({ role: "user", content: text });
        renderMessages();

        try {
            const res = await fetch(WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages })
            });

            const data = await res.json();

            if (data.success) {
                // AI 回答直接存原始 Markdown 文本，渲染时再解析
                messages.push({ role: "assistant", content: data.answer });
            } else {
                messages.push({
                    role: "error",
                    content: `❌ Error: ${data.error || 'Unknown error'}`
                });
            }
            renderMessages();

        } catch (e) {
            console.error("Network error:", e);
            messages.push({
                role: "error",
                content: "❌ Service exception, please try again later"
            });
            renderMessages();
        }
    }

    // 回车事件处理（修复中文输入法问题）
    chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.isComposing) {
            e.preventDefault();
            sendMessage();
        }
    });

    chatInput.addEventListener("compositionend", (e) => {
        if (e.data && e.key === "Enter") {
            sendMessage();
        }
    });

    // 可选：优化 marked 渲染配置（比如禁用 HTML 标签，防止 XSS）
    marked.setOptions({
        sanitize: true, // 禁用 HTML 标签，只渲染 Markdown 语法
        mangle: false
    });
</script>
