<style>
    #chat-float-btn {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: #0070f3;
        color: white;
        font-size: 24px;
        border: none;
        box-shadow: 0 4px 12px rgba(0,112,243,0.3);
        cursor: pointer;
        z-index: 9998;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
    }
    #chat-float-btn:hover {
        transform: scale(1.08);
    }

    #chat-modal {
        position: fixed;
        bottom: 90px;
        right: 24px;
        width: 450px;
        height: 650px;
        max-width: calc(100vw - 48px);
        max-height: 85vh;
        background: rgba(255,255,255,0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 20px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        border: 1px solid rgba(255,255,255,0.3);
        z-index: 9999;
        display: none;
        flex-direction: column;
        overflow: hidden;
    }
    #chat-modal.active {
        display: flex;
        animation: fadeIn 0.2s ease-in-out;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .chat-header {
        padding: 16px;
        font-weight: 600;
        font-size: 16px;
        color: #111;
        border-bottom: 1px solid rgba(0,0,0,0.05);
        background: rgba(255,255,255,0.5);
    }

    .chat-messages {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
        font-size: 14px;
        line-height: 1.6;
    }

    .chat-input-bar {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid rgba(0,0,0,0.05);
        background: rgba(255,255,255,0.5);
    }
    .chat-input-bar input {
        flex: 1;
        padding: 10px 14px;
        border-radius: 20px;
        border: 1px solid rgba(0,0,0,0.1);
        outline: none;
        font-size: 14px;
        background: rgba(255,255,255,0.8);
    }
    .chat-input-bar button {
        padding: 0 16px;
        border-radius: 20px;
        background: #0070f3;
        color: white;
        border: none;
        font-size: 14px;
        cursor: pointer;
    }
    .chat-input-bar button:disabled, .chat-input-bar input:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .bubble-user {
        background: #0070f3;
        color: white;
        padding: 8px 12px;
        border-radius: 14px 14px 4px 14px;
        margin: 8px 0;
        max-width: 85%;
        margin-left: auto;
    }
    .bubble-ai {
        background: rgba(0,0,0,0.06);
        color: #111;
        padding: 12px 16px;
        border-radius: 14px 14px 14px 4px;
        margin: 8px 0;
        max-width: 85%;
        margin-right: auto;
    }
    .bubble-error {
        background: #ff4d4f;
        color: white;
        padding: 8px 12px;
        border-radius: 14px 14px 14px 4px;
        margin: 8px 0;
        max-width: 85%;
        margin-right: auto;
    }

    /* ===== Markdown & KaTeX 渲染样式 ===== */
    .markdown-content h1 { font-size: 18px; font-weight: 600; margin: 8px 0; }
    .markdown-content h2 { font-size: 16px; font-weight: 600; margin: 6px 0; }
    .markdown-content h3 { font-size: 15px; font-weight: 600; margin: 4px 0; }
    .markdown-content strong { font-weight: 600; color: #0070f3; }
    .markdown-content em { font-style: italic; }
    .markdown-content ul, .markdown-content ol { padding-left: 20px; margin: 4px 0; }
    .markdown-content li { margin: 2px 0; }
    .markdown-content a { color: #0070f3; text-decoration: underline; word-break: break-all; }
    .markdown-content code { background: rgba(0,0,0,0.1); padding: 1px 4px; border-radius: 4px; font-family: monospace; font-size: 13px; }
    .markdown-content pre { background: rgba(0,0,0,0.1); padding: 8px; border-radius: 8px; overflow-x: auto; margin: 6px 0; }
    .markdown-content pre code { background: none; padding: 0; }

    /* 防止长公式超出气泡引发横向滚动条乱跳 */
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 5px 0; margin: 0.5em 0; }
</style>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<button id="chat-float-btn" onclick="toggleChat()">💬</button>

<div id="chat-modal">
    <div class="chat-header">Ask me anything</div>
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-input-bar">
        <input id="chat-input" placeholder="Input the question" autocomplete="off">
        <button onclick="sendMessage()" id="chat-send-btn">Send</button>
    </div>
</div>

<script>
    const WORKER_URL = "https://square-mode-81a5.1793410861.workers.dev/";

    let messages = [
        { role: "assistant", content: "Hello~ 👋 I am your blog AI assistant 🤖. You can ask me anything about this blog ✨." }
    ];

    const modal = document.getElementById("chat-modal");
    const messagesDom = document.getElementById("chat-messages");
    const chatInput = document.getElementById("chat-input");
    const sendBtn = document.getElementById("chat-send-btn");

    function toggleChat() {
        modal.classList.toggle("active");
        renderMessages();
    }

    // 带“数学公式保护罩”的 Markdown 解析
    function renderMarkdown(text) {
        const mathBlocks = [];

        // 1. 提取出所有的 LaTeX 公式，并用纯字母组成的占位符替换，防止被 marked.js 误伤
        text = text.replace(/(\$\$[\s\S]*?\$\$|\$[\s\S]*?\$|\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\))/g, (match) => {
            mathBlocks.push(match);
            return `MATHPLACEHOLDER${mathBlocks.length - 1}END`;
        });

        // 2. 解析 Markdown
        let html = marked.parse(text, { breaks: true, gfm: true });

        // 3. 把数学公式原封不动地放回 HTML 代码中
        mathBlocks.forEach((block, index) => {
            html = html.replace(`MATHPLACEHOLDER${index}END`, block);
        });

        return html;
    }

    // 渲染消息界面并触发生态渲染
    function renderMessages() {
        // 更新内部 HTML (这会把 Markdown 转成 HTML，公式保留为纯文本)
        messagesDom.innerHTML = messages.map(m => {
            if (m.role === 'assistant') {
                return `
                    <div class="bubble-ai">
                        <div class="markdown-content">${renderMarkdown(m.content)}</div>
                    </div>
                `;
            } else if (m.role === 'user') {
                return `<div class="bubble-user">${escapeHtml(m.content)}</div>`;
            } else {
                return `<div class="bubble-error">${m.content}</div>`;
            }
        }).join("");

        messagesDom.scrollTop = messagesDom.scrollHeight;

        // 调用 KaTeX 渲染刚刚放进去的所有数学公式
        if (window.renderMathInElement) {
            renderMathInElement(messagesDom, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '\\[', right: '\\]', display: true},
                    {left: '$', right: '$', display: false},
                    {left: '\\(', right: '\\)', display: false}
                ],
                throwOnError: false // 遇到语法错误时静默失败，避免整个应用崩溃
            });
        }
    }

    // 安全转义 HTML 特殊字符
    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // 控制输入框防抖状态
    function setInputState(disabled) {
        chatInput.disabled = disabled;
        sendBtn.disabled = disabled;
        if (!disabled) chatInput.focus();
    }

    async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        chatInput.value = "";
        setInputState(true);

        messages.push({ role: "user", content: text });
        messages.push({ role: "assistant", content: "" });
        const aiMessageIndex = messages.length - 1;
        renderMessages();

        try {
            const payloadMessages = messages.slice(0, -1);

            const res = await fetch(WORKER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ messages: payloadMessages })
            });

            if (!res.ok) throw new Error(`HTTP Error ${res.status}`);

            const reader = res.body.getReader();
            const decoder = new TextDecoder("utf-8");

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split("\n").filter(line => line.trim() !== "");

                for (const line of lines) {
                    if (line.includes("[DONE]")) continue;

                    if (line.startsWith("data:")) {
                        try {
                            const data = JSON.parse(line.slice(5));
                            const contentStr = data.choices[0]?.delta?.content || "";
                            if (contentStr) {
                                messages[aiMessageIndex].content += contentStr;
                                renderMessages();
                            }
                        } catch (e) {
                            // 忽略单一数据块解析错误
                        }
                    }
                }
            }

        } catch (e) {
            console.error("Network error:", e);
            messages[aiMessageIndex] = {
                role: "error",
                content: "❌ Service exception, please try again later."
            };
            renderMessages();
        } finally {
            setInputState(false);
        }
    }

    // 中文输入法事件监听，防止在打字时误发送
    let isComposing = false;
    chatInput.addEventListener("compositionstart", () => isComposing = true);
    chatInput.addEventListener("compositionend", (e) => {
        isComposing = false;
        if (e.data && e.key === "Enter" && !chatInput.disabled) {
            sendMessage();
        }
    });

    chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !isComposing && !chatInput.disabled) {
            e.preventDefault();
            sendMessage();
        }
    });

    // Marked 配置
    marked.setOptions({ mangle: false, headerIds: false });
</script>
